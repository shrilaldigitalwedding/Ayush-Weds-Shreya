    <script>
    (function () {
        const eventId = 8;
        const guestId = null;
        const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

        window.addEventListener('message', function (e) {
            const msg = e.data;
            if (!msg || typeof msg !== 'object' || msg.type !== 'balcony:rsvp') return;

            fetch('https://www.itsbalcony.com/api/rsvp', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': csrfToken,
                    'Accept': 'application/json',
                },
                body: JSON.stringify({
                    eventId: eventId,
                    // Null on the common link - the guest identifies themselves
                    // with the name + contact below instead.
                    guestId: guestId,
                    // Asked on both links; on the common one it is the identity,
                    // so a repeat reply from the same number updates the first.
                    contact: typeof msg.contact === 'string' ? msg.contact : null,
                    // Only sent from the common link; ignored when guestId is set.
                    name: typeof msg.name === 'string' ? msg.name : null,
                    // Per-event answers from the shared RSVP module.
                    responses: Array.isArray(msg.responses) ? msg.responses : [],
                    // Free-text wishes to the couple (one per guest).
                    message: typeof msg.message === 'string' ? msg.message : null,
                }),
            });
        });
    })();
    </script>
</body>
